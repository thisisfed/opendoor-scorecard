name: Update Opendoor scorecard

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC (22:30 UK in winter, 23:30 in summer), after the US close
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      send_newsletter:
        description: "Also email subscribers anything due today (normally only the evening run does)"
        type: boolean
        default: false
      test_newsletter:
        description: "Email me a test of both newsletters (only you get it; subscribers don't)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["opendoor_kpis.csv", "opendoor_scorecard.py"]   # rerun when you edit the data or the script

permissions:
  contents: write   # to save history.csv back to the repo
  pages: write
  id-token: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the scorecard
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
        run: python3 opendoor_scorecard.py --outdir site

      # Private page at /me/ with your position in pounds; does nothing until the three POSITION_* secrets are set
      - name: Private position page
        env:
          POSITION_PASSPHRASE: ${{ secrets.POSITION_PASSPHRASE }}
          POSITION_SHARES: ${{ secrets.POSITION_SHARES }}
          POSITION_COST_USD: ${{ secrets.POSITION_COST_USD }}
        run: |
          if [ -n "$POSITION_PASSPHRASE" ]; then
            pip install --quiet cryptography && python3 position_page.py
          else
            echo "Position page: secrets not set, skipped."
          fi

      - name: Save score history to the repo
        run: |
          git config user.name "Federico Ferrari"
          git config user.email "14325884+thisisfed@users.noreply.github.com"
          git add site accountable_snapshot.json contracts_quarterly.json short_cache.json estimates_log.json price_cache.json releases_cache.json macro_cache.json dilution_cache.json housing_cache.json $(ls position_log.enc 2>/dev/null) 2>/dev/null || git add -A site *.json
          if ! git diff --cached --quiet; then
            git commit -m "Scorecard update $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # After the page is live: email subscribers (does nothing until the BUTTONDOWN_API_KEY secret is set)
      - name: Email subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send_newsletter == true }}
          TEST: ${{ inputs.test_newsletter == true }}
        run: |
          if [ "$TEST" = "true" ]; then python3 newsletter.py --test; fi
          if [ "$SEND" = "true" ]; then python3 newsletter.py --send; fi
          git add newsletter_log.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Newsletter sent $(date -u +%F)"
            git pull --rebase
            git push
          fi
